REDIS_HOST=judge0_redis
REDIS_PORT=6379

POSTGRES_HOST=judge0_db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=postgres
POSTGRES_PASSWORD=judge0pass

# Per-submission defaults
# Memory limit is NOT enforced by isolate -m flag (see patch_isolate.sh)
# These values only affect API validation, not actual runtime limits
CPU_TIME_LIMIT=10
WALL_TIME_LIMIT=15
MEMORY_LIMIT=512000
STACK_LIMIT=65536
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=1024

# Hard caps for API validation only (isolate -m flag is patched out)
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=512000
MAX_STACK_LIMIT=65536
MAX_MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_FILE_SIZE=4096
MAX_EXTRACT_SIZE=10240

# WSL2 CGROUP FIX:
# When BOTH of these are true → Judge0 does NOT pass --cg to isolate
# → isolate runs WITHOUT cgroup memory/time enforcement
# → Works on WSL2 which only has cgroup v2 (no memory cgroup v1)
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# Security
DISABLE_NETWORK_PER_SUBMISSION=true

# Batched submissions
ENABLE_BATCHED_SUBMISSIONS=true
MAX_QUEUE_SIZE=100

# Rails
RAILS_ENV=production
SECRET_KEY_BASE=change_this_in_production_to_random_string_64chars
