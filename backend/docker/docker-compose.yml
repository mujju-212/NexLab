version: '3.8'

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: vlab_postgres
    environment:
      POSTGRES_DB: virtuallab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask Backend ──────────────────────────────────────────────────────────
  flask_app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vlab_api
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/virtuallab
      GROQ_API_KEY: ${GROQ_API_KEY}
      JUDGE0_URL: http://judge0_server:2358
      JUDGE0_MODE: polling
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BASE_URL: ${BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - ../ml_models:/app/ml_models    # mount trained model files
    depends_on:
      postgres:
        condition: service_healthy
      judge0_server:
        condition: service_started
    restart: unless-stopped

  # ── Judge0 (Code Execution) ────────────────────────────────────────────────
  judge0_server:
    image: judge0/judge0:1.13.0
    container_name: vlab_judge0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    depends_on:
      - judge0_db
      - judge0_redis
    privileged: true
    restart: always

  judge0_workers:
    image: judge0/judge0:1.13.0
    container_name: vlab_judge0_workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0_db
      - judge0_redis
    privileged: true
    restart: always

  judge0_db:
    image: postgres:13
    container_name: vlab_judge0_db
    environment:
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0pgdata:/var/lib/postgresql/data

  judge0_redis:
    image: redis:5.0.9
    container_name: vlab_judge0_redis

volumes:
  pgdata:
  judge0pgdata:
