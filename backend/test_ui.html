<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexLab — Docker Engine Test</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --grad-a:#7c3aed; --grad-b:#d6409f;
    --accent:#8b5cf6;
    --border-glass:rgba(255,255,255,.55);
    --text-1:#201b2e; --text-2:#615a72; --text-3:#9891a6;
    --green:#0f8a3f; --green-bg:rgba(209,250,223,.85);
    --red:#c62828;   --red-bg:rgba(255,220,220,.85);
    --yellow:#b45309;--yellow-bg:rgba(255,245,180,.85);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Manrope',sans-serif}
  .stage{position:relative;min-height:100vh;overflow:hidden;
    background:linear-gradient(150deg,#fff 0%,#f4f5f7 45%,#eef0f3 75%,#fff 100%);
    padding:20px;display:flex;flex-direction:column;gap:14px}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
  .blob-1{width:500px;height:500px;top:-200px;left:200px;background:radial-gradient(circle,#fff,#e2e5eb 70%);opacity:.9}
  .blob-2{width:400px;height:400px;bottom:-180px;left:-140px;background:radial-gradient(circle,#fff,#e7e9ee 70%);opacity:.8}
  .glass{background:rgba(255,255,255,.45);backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--border-glass);
    border-radius:18px;box-shadow:0 20px 60px -20px rgba(30,30,40,.12),inset 0 1px 0 rgba(255,255,255,.8)}
  /* Topbar */
  .topbar{display:flex;align-items:center;gap:12px;padding:11px 18px;position:relative;z-index:10}
  .logo-icon{width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .logo-text{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--text-1)}
  .logo-text span{color:var(--accent)}
  .engine-badge{font-size:11px;font-weight:700;padding:3px 10px;
    background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);
    border-radius:999px;color:var(--accent)}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .lang-select{background:rgba(255,255,255,.7);border:1px solid var(--border-glass);
    border-radius:10px;padding:7px 12px;font-family:'Manrope',sans-serif;
    font-size:13px;font-weight:600;color:var(--text-1);outline:none;cursor:pointer}
  .run-btn{display:flex;align-items:center;gap:8px;padding:8px 20px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
    color:#fff;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(124,58,237,.35);transition:opacity .15s,transform .1s}
  .run-btn:hover{opacity:.9;transform:translateY(-1px)}
  .run-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .run-btn.running{background:linear-gradient(135deg,#d97706,#f59e0b)}
  /* Layout */
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;position:relative;z-index:10;min-height:0}
  .editor-pane,.output-pane{display:flex;flex-direction:column;overflow:hidden}
  .pane-header{padding:13px 17px 11px;border-bottom:1px solid rgba(255,255,255,.6);
    display:flex;align-items:center;gap:10px}
  .pane-title{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;
    color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
  .dot-row{display:flex;gap:5px;margin-left:auto}
  .dot{width:11px;height:11px;border-radius:50%}
  textarea#code{flex:1;background:transparent;border:none;resize:none;
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;
    color:var(--text-1);padding:15px 17px;outline:none;tab-size:4;min-height:340px}
  .stdin-row{border-top:1px solid rgba(255,255,255,.6);padding:9px 17px;
    display:flex;align-items:center;gap:10px}
  .stdin-label{font-size:11px;font-weight:700;color:var(--text-3);white-space:nowrap}
  input#stdin{flex:1;background:rgba(255,255,255,.6);border:1px solid var(--border-glass);
    border-radius:8px;padding:6px 11px;font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--text-1);outline:none}
  input#stdin:focus{border-color:var(--accent)}
  /* Output */
  .out-header{padding:13px 17px 11px;border-bottom:1px solid rgba(255,255,255,.6);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:47px}
  .stat-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    border:1px solid var(--border-glass);background:rgba(255,255,255,.55);color:var(--text-2)}
  .stat-pill.ok {background:var(--green-bg);color:var(--green);border-color:rgba(15,138,63,.2)}
  .stat-pill.err{background:var(--red-bg);color:var(--red);border-color:rgba(198,40,40,.2)}
  .stat-pill.docker{background:rgba(124,58,237,.1);color:var(--accent);border-color:rgba(124,58,237,.25)}
  #output{flex:1;overflow-y:auto;padding:15px 17px;
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7}
  .idle-msg{color:var(--text-3);font-family:'Manrope',sans-serif;font-size:13px}
  .out-ok{color:var(--text-1);white-space:pre-wrap;word-break:break-all}
  .out-err{color:var(--red);white-space:pre-wrap}
  .out-warn{color:var(--yellow);white-space:pre-wrap}
  .out-section{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);
    margin-bottom:5px;margin-top:12px}
  .out-block{margin-bottom:6px}
  .loading-msg{display:flex;align-items:center;gap:10px;
    color:var(--accent);font-family:'Manrope',sans-serif;font-size:13px}
  .spinner{display:inline-block;width:14px;height:14px;
    border:2px solid rgba(139,92,246,.25);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  #debugRaw{display:none;position:fixed;bottom:0;left:0;right:0;max-height:120px;
    overflow:auto;z-index:999;background:rgba(20,5,40,.96);border-top:2px solid var(--grad-b);
    color:#f0883e;font-family:'JetBrains Mono',monospace;font-size:11px;padding:10px 15px;white-space:pre}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-thumb{background:rgba(139,92,246,.25);border-radius:999px}
  /* Auth section */
  .auth-bar{display:flex;align-items:center;gap:10px;padding:10px 17px;
    font-size:12px;color:var(--text-3);flex-wrap:wrap}
  .auth-bar input{background:rgba(255,255,255,.6);border:1px solid var(--border-glass);
    border-radius:8px;padding:5px 10px;font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--text-1);outline:none;width:340px}
  .auth-bar label{font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Topbar -->
  <div class="glass topbar">
    <div class="logo-icon">⚡</div>
    <span class="logo-text">Nex<span>Lab</span></span>
    <span class="engine-badge">🐳 Docker Engine v2 Test</span>
    <div class="topbar-right">
      <select id="lang" class="lang-select" onchange="onLangChange()">
        <option value="python">🐍 Python 3.14</option>
        <option value="javascript">🟨 JavaScript (Node 24)</option>
        <option value="typescript">🔷 TypeScript 7</option>
        <option value="c">⚙️ C (GCC 16 / C23)</option>
        <option value="cpp">🔵 C++ (GCC 16 / C++23)</option>
        <option value="java">☕ Java (JDK 25)</option>
        <option value="kotlin">🟣 Kotlin 2.4</option>
        <option value="csharp">💜 C# (.NET 10)</option>
        <option value="r">📊 R 4.5</option>
        <option value="bash">🐚 Bash 5.3</option>
        <option value="sql">🗄️ SQL (SQLite)</option>
      </select>
      <button class="run-btn" id="runBtn" onclick="runCode()">
        <span id="btnIcon">▶</span><span id="btnText">Run</span>
      </button>
    </div>
  </div>

  <!-- JWT token input -->
  <div class="glass auth-bar">
    <label>JWT Token:</label>
    <input id="jwt" type="text" placeholder="Paste your JWT here (get it from DevTools → Application → localStorage → token)">
  </div>

  <!-- Main Layout -->
  <div class="layout">
    <!-- Editor -->
    <div class="glass editor-pane">
      <div class="pane-header">
        <span class="pane-title">Editor</span>
        <div class="dot-row">
          <div class="dot" style="background:#ff5f56"></div>
          <div class="dot" style="background:#ffbd2e"></div>
          <div class="dot" style="background:#27c93f"></div>
        </div>
      </div>
      <textarea id="code" spellcheck="false" placeholder="Write your code here…"></textarea>
      <div class="stdin-row">
        <span class="stdin-label">stdin:</span>
        <input id="stdin" type="text" placeholder="Optional input…">
      </div>
    </div>

    <!-- Output -->
    <div class="glass output-pane">
      <div class="out-header" id="outHeader">
        <span class="pane-title">Output</span>
      </div>
      <div id="output">
        <div class="idle-msg">Press <strong>Run</strong> to execute — hitting <code style="font-family:inherit;font-size:11px;background:rgba(255,255,255,.7);border:1px solid var(--border-glass);border-radius:5px;padding:1px 6px">/api/execution/playground</code> via Docker v2.</div>
      </div>
    </div>
  </div>
</div>
<div id="debugRaw"></div>

<script>
const API = 'http://localhost:5000/api/execution/playground';

const STARTERS = {
  python:
`# Python 3.14 — Docker v2
x = [1, 2, 3, 4, 5]
print("Hello from Python 3.14!")
print("Sum:", sum(x))
print("Squares:", [n**2 for n in x])`,

  javascript:
`// JavaScript — Node 24
const nums = [1, 2, 3, 4, 5];
console.log("Hello from Node 24!");
console.log("Sum:", nums.reduce((a, b) => a + b, 0));
console.log("Squares:", nums.map(n => n * n));`,

  typescript:
`// TypeScript 7 — native Go compiler
const greet = (name: string): string => \`Hello, \${name}!\`;
console.log(greet("NexLab"));
const squares: number[] = [1,2,3,4,5].map(n => n ** 2);
console.log("Squares:", squares);`,

  c:
`// C23 — GCC 16
#include <stdio.h>
int main(void) {
    printf("Hello from C23!\\n");
    int sum = 0;
    for (int i = 1; i <= 10; i++) sum += i;
    printf("Sum 1..10 = %d\\n", sum);
    return 0;
}`,

  cpp:
`// C++23 — GCC 16
#include <iostream>
#include <vector>
#include <numeric>
int main() {
    std::vector<int> v = {1,2,3,4,5};
    int sum = std::accumulate(v.begin(), v.end(), 0);
    std::cout << "Hello from C++23!" << std::endl;
    std::cout << "Sum: " << sum << std::endl;
    return 0;
}`,

  java:
`// Java 25 — JDK 25
public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from Java 25!");
        int sum = 0;
        for (int i = 1; i <= 10; i++) sum += i;
        System.out.println("Sum 1..10 = " + sum);
    }
}`,

  kotlin:
`// Kotlin 2.4 — JDK 25
fun main() {
    println("Hello from Kotlin 2.4!")
    val squares = (1..5).map { it * it }
    println("Squares: $squares")
}`,

  csharp:
`// C# 14 — .NET 10 top-level statements
Console.WriteLine("Hello from C# 14 / .NET 10!");
var squares = Enumerable.Range(1, 5).Select(n => n * n).ToList();
Console.WriteLine($"Squares: [{string.Join(", ", squares)}]");`,

  r:
`# R 4.5
cat("Hello from R 4.5!\\n")
x <- 1:10
cat("Mean:", mean(x), "\\n")
cat("Sum:", sum(x), "\\n")`,

  bash:
`#!/bin/bash
# Bash 5.3
echo "Hello from Bash 5.3!"
for i in 1 2 3 4 5; do
  echo "  $i squared = $((i * i))"
done`,

  sql:
`-- SQLite 3.5x
CREATE TABLE students (id INTEGER, name TEXT, score REAL);
INSERT INTO students VALUES (1, 'Alice', 95.5), (2, 'Bob', 82.0), (3, 'Carol', 88.5);
SELECT name, score FROM students ORDER BY score DESC;
SELECT 'Average: ' || AVG(score) FROM students;`
};

window.onload = () => onLangChange();

function onLangChange() {
  const lang = document.getElementById('lang').value;
  const ta = document.getElementById('code');
  const starterValues = Object.values(STARTERS);
  if (!ta.value.trim() || starterValues.includes(ta.value)) {
    ta.value = STARTERS[lang] || '';
  }
  setIdle();
}

function setIdle() {
  document.getElementById('output').innerHTML =
    '<div class="idle-msg">Press <strong>Run</strong> to execute your code.</div>';
  document.getElementById('outHeader').innerHTML = '<span class="pane-title">Output</span>';
  document.getElementById('debugRaw').style.display = 'none';
}

function setRunning(on) {
  const btn = document.getElementById('runBtn');
  btn.disabled = on;
  btn.className = on ? 'run-btn running' : 'run-btn';
  document.getElementById('btnIcon').textContent = on ? '⏳' : '▶';
  document.getElementById('btnText').textContent = on ? 'Running…' : 'Run';
}

async function runCode() {
  const code  = document.getElementById('code').value.trim();
  const lang  = document.getElementById('lang').value;
  const stdin = document.getElementById('stdin').value;
  const jwt   = document.getElementById('jwt').value.trim();

  if (!code) { showError('Editor is empty — write some code first.'); return; }
  if (!jwt)  { showError('Paste your JWT token in the field above.\n\nGet it from:\nBrowser DevTools → Application → Local Storage → localhost:3000 → "token"'); return; }

  setRunning(true);
  document.getElementById('output').innerHTML =
    '<div class="loading-msg"><div class="spinner"></div> Running in Docker sandbox…</div>';
  document.getElementById('outHeader').innerHTML = '<span class="pane-title">Output</span>';

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${jwt}`,
      },
      body: JSON.stringify({ code, language: lang, stdin }),
    });

    const data = await resp.json();

    // Show raw response in debug bar
    const dbg = document.getElementById('debugRaw');
    dbg.style.display = 'block';
    dbg.textContent = `HTTP ${resp.status} ← ${JSON.stringify(data, null, 2).slice(0, 800)}`;

    if (!resp.ok) {
      showError(data.error || `HTTP ${resp.status}`);
      setRunning(false);
      return;
    }

    renderResult(data);
  } catch (err) {
    showError(`Network error: ${err.message}\n\nIs the backend running on port 5000?`);
  }

  setRunning(false);
}

function renderResult(d) {
  const lang    = document.getElementById('lang').value;
  const sid     = d.status_id ?? 0;
  const desc    = d.status    ?? 'Unknown';
  const ok      = d.success   ?? sid === 3;
  const stdout  = d.stdout        || '';
  const stderr  = d.stderr        || '';
  const cerr    = d.compile_output|| '';
  const engine  = d.engine        || 'unknown';
  const timeMs  = d.time_ms != null ? d.time_ms : null;
  const compMs  = d.compile_ms != null && d.compile_ms > 0 ? d.compile_ms : null;
  const memKb   = d.memory_kb != null ? d.memory_kb : null;
  const trunc   = d.truncated ? ' · truncated' : '';

  // Header pills
  let hdr = `<span class="pane-title">Output</span>
    <span class="stat-pill ${ok ? 'ok' : 'err'}">${esc(desc)}</span>`;
  hdr += `<span class="stat-pill docker">🐳 ${esc(engine)}</span>`;
  hdr += `<span class="stat-pill">${lang.toUpperCase()}</span>`;
  if (timeMs  != null) hdr += `<span class="stat-pill ok">⏱ run ${timeMs}ms</span>`;
  if (compMs  != null) hdr += `<span class="stat-pill">🔨 compile ${compMs}ms</span>`;
  if (memKb   != null) hdr += `<span class="stat-pill">🧠 ${(memKb/1024).toFixed(1)} MB</span>`;
  if (trunc)           hdr += `<span class="stat-pill err">⚠ truncated</span>`;
  document.getElementById('outHeader').innerHTML = hdr;

  // Body
  let html = '';
  if (cerr) {
    html += `<div class="out-block">
      <div class="out-section">Compilation Error</div>
      <div class="out-err">${esc(cerr)}</div>
    </div>`;
  }
  if (stdout) {
    const clean = stdout.split('\n').map(l => l.split('\r').pop()).join('\n').trimEnd();
    html += `<div class="out-block">
      ${cerr ? '<div class="out-section" style="margin-top:8px">stdout</div>' : ''}
      <div class="out-ok">${esc(clean)}</div>
    </div>`;
  }
  if (stderr) {
    html += `<div class="out-block">
      <div class="out-section">stderr</div>
      <div class="out-warn">${esc(stderr)}</div>
    </div>`;
  }
  if (!stdout && !stderr && !cerr) {
    html += ok
      ? `<div class="out-block" style="color:var(--text-3)">✓ Ran successfully with no output.</div>`
      : `<div class="out-block out-err">❌ ${esc(desc)}</div>`;
  }

  document.getElementById('output').innerHTML = html;
}

function showError(msg) {
  document.getElementById('output').innerHTML =
    `<div class="out-block out-err">❌ ${esc(msg)}</div>`;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('code').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target, s = ta.selectionStart;
    ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 4;
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    runCode();
  }
});
</script>
</body>
</html>
