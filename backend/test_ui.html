<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexLab — Code Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --grad-a:#7c3aed; --grad-b:#d6409f; --grad-c:#f2994a;
    --accent:#8b5cf6;
    --border-glass:rgba(255,255,255,.55);
    --text-1:#201b2e; --text-2:#615a72; --text-3:#9891a6;
    --green:#0f8a3f; --green-bg:rgba(209,250,223,.85);
    --red:#c62828; --red-bg:rgba(255,220,220,.85);
    --yellow:#b45309; --yellow-bg:rgba(255,245,180,.85);
    --surface:rgba(255,255,255,.45);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Manrope', sans-serif; }

  /* Stage */
  .stage {
    position: relative; min-height: 100vh; overflow: hidden;
    background: linear-gradient(150deg,#ffffff 0%,#f4f5f7 45%,#eef0f3 75%,#ffffff 100%);
    padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .blob { position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none; }
  .blob-1 { width:500px;height:500px;top:-200px;left:200px;background:radial-gradient(circle,#ffffff,#e2e5eb 70%);opacity:.9; }
  .blob-2 { width:400px;height:400px;bottom:-180px;left:-140px;background:radial-gradient(circle,#ffffff,#e7e9ee 70%);opacity:.8; }
  .blob-3 { width:360px;height:360px;top:40px;right:-120px;background:radial-gradient(circle,#ffffff,#eceef2 70%);opacity:.7; }

  /* Glass panel base */
  .glass {
    background: rgba(255,255,255,.45);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    box-shadow: 0 20px 60px -20px rgba(30,30,40,.12), inset 0 1px 0 rgba(255,255,255,.8);
  }

  /* Top navbar */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; position: relative; z-index: 10;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: var(--text-1); }
  .logo-text span { color: var(--accent); }
  .topbar-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px;
    background: rgba(255,255,255,.6); border: 1px solid var(--border-glass);
    border-radius: 999px; color: var(--text-3);
  }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .lang-select {
    background: rgba(255,255,255,.55); border: 1px solid var(--border-glass);
    border-radius: 10px; padding: 7px 12px; font-family: 'Manrope', sans-serif;
    font-size: 13px; font-weight: 600; color: var(--text-1); outline: none; cursor: pointer;
  }
  .run-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 20px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    color: #fff; font-family: 'Space Grotesk', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(124,58,237,.35); transition: opacity .15s, transform .1s;
  }
  .run-btn:hover { opacity: .9; transform: translateY(-1px); }
  .run-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .run-btn.running { background: linear-gradient(135deg, #d97706, #f59e0b); }

  /* Main layout */
  .layout {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; flex: 1; position: relative; z-index: 10;
    min-height: 0;
  }

  /* Editor panel */
  .editor-pane { display: flex; flex-direction: column; overflow: hidden; }
  .pane-header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,.6);
    display: flex; align-items: center; gap: 10px;
  }
  .pane-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 13px;
    font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em;
  }
  .dot-row { display: flex; gap: 6px; margin-left: auto; }
  .dot-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
  .dot-red   { background: #ff5f56; }
  .dot-yel   { background: #ffbd2e; }
  .dot-grn   { background: #27c93f; }

  textarea#code {
    flex: 1; background: transparent; border: none; resize: none;
    font-family: 'JetBrains Mono', monospace; font-size: 13.5px;
    line-height: 1.65; color: var(--text-1); padding: 16px 18px;
    outline: none; tab-size: 4; min-height: 360px;
  }
  textarea#code::placeholder { color: var(--text-3); }

  .stdin-row {
    border-top: 1px solid rgba(255,255,255,.6);
    padding: 10px 18px; display: flex; align-items: center; gap: 10px;
  }
  .stdin-label { font-size: 12px; font-weight: 700; color: var(--text-3); white-space: nowrap; }
  input#stdin {
    flex: 1; background: rgba(255,255,255,.55); border: 1px solid var(--border-glass);
    border-radius: 8px; padding: 6px 12px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--text-1); outline: none;
  }
  input#stdin:focus { border-color: var(--accent); }

  /* Output panel */
  .output-pane { display: flex; flex-direction: column; overflow: hidden; }
  .out-header {
    padding: 14px 18px 12px; border-bottom: 1px solid rgba(255,255,255,.6);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 49px;
  }
  .stat-pill {
    font-size: 11.5px; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; border: 1px solid var(--border-glass);
    background: rgba(255,255,255,.55); color: var(--text-2);
  }
  .stat-pill.ok  { background: var(--green-bg); color: var(--green); border-color: rgba(15,138,63,.2); }
  .stat-pill.err { background: var(--red-bg);   color: var(--red);   border-color: rgba(198,40,40,.2); }

  #output {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.65;
  }
  .idle-msg  { color: var(--text-3); font-family: 'Manrope', sans-serif; font-size: 13.5px; }
  .out-ok    { color: var(--text-1); white-space: pre-wrap; word-break: break-all; }
  .out-err   { color: var(--red);    white-space: pre-wrap; }
  .out-warn  { color: var(--yellow); white-space: pre-wrap; }
  .out-section {
    font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; color: var(--text-3);
    margin-bottom: 6px; margin-top: 14px;
  }
  .out-block { margin-bottom: 8px; }
  .loading-msg {
    display: flex; align-items: center; gap: 10px;
    color: var(--accent); font-family: 'Manrope', sans-serif; font-size: 13.5px;
  }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(139,92,246,.25); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #debugRaw {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    max-height: 130px; overflow: auto; z-index: 999;
    background: rgba(30,10,60,.95); border-top: 2px solid var(--grad-b);
    color: #f0883e; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; padding: 10px 16px; white-space: pre;
    backdrop-filter: blur(10px);
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(139,92,246,.25); border-radius: 999px; }
</style>
</head>
<body>
<div class="stage">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Topbar -->
  <div class="glass topbar">
    <div class="logo-wrap">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">Nex<span>Lab</span></span>
    </div>
    <span class="topbar-badge">Code Runner · Judge0 Direct</span>
    <div class="topbar-right">
      <select id="lang" class="lang-select" onchange="onLangChange()">
        <option value="python">🐍 Python 3</option>
        <option value="c">⚙️ C (GCC)</option>
        <option value="cpp">🔵 C++ 17</option>
        <option value="java">☕ Java 13</option>
        <option value="javascript">🟨 JavaScript</option>
        <option value="r">📊 R</option>
        <option value="octave">📐 Octave</option>
      </select>
      <button class="run-btn" id="runBtn" onclick="runCode()">
        <span id="btnIcon">▶</span><span id="btnText">Run</span>
      </button>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="layout">
    <!-- Editor -->
    <div class="glass editor-pane">
      <div class="pane-header">
        <span class="pane-title">Editor</span>
        <div class="dot-row">
          <div class="dot-btn dot-red"></div>
          <div class="dot-btn dot-yel"></div>
          <div class="dot-btn dot-grn"></div>
        </div>
      </div>
      <textarea id="code" spellcheck="false" placeholder="Write your code here…"></textarea>
      <div class="stdin-row">
        <span class="stdin-label">stdin:</span>
        <input id="stdin" type="text" placeholder="Optional input…">
      </div>
    </div>

    <!-- Output -->
    <div class="glass output-pane">
      <div class="out-header" id="outHeader">
        <span class="pane-title">Output</span>
      </div>
      <div id="output">
        <div class="idle-msg">Press <strong>Run</strong> to execute your code. &nbsp;<kbd style="font-family:inherit;font-size:11px;background:rgba(255,255,255,.7);border:1px solid var(--border-glass);border-radius:6px;padding:1px 6px;">Ctrl+Enter</kbd></div>
      </div>
    </div>
  </div>
</div>

<div id="debugRaw"></div>

<script>
const JUDGE0_URL = 'http://localhost:2358';
const LANG_IDS = { python:71, c:49, cpp:54, java:62, javascript:63, r:80, octave:66 };
const TEMPLATES = {
  python:`print("Hello, World!")\nx = [1,2,3,4,5]\nprint("Sum:", sum(x))\nprint("Squares:", [i**2 for i in x])`,
  c:`#include <stdio.h>\nint main() {\n    int i, sum = 0;\n    for (i = 1; i <= 10; i++) sum += i;\n    printf("Sum 1 to 10 = %d\\n", sum);\n    return 0;\n}`,
  cpp:`#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n    vector<int> v = {1,2,3,4,5};\n    int sum = 0;\n    for (int x : v) sum += x;\n    cout << "C++ Sum = " << sum << endl;\n    return 0;\n}`,
  java:`public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from Java!");\n        int sum = 0;\n        for (int i = 1; i <= 10; i++) sum += i;\n        System.out.println("Sum 1-10 = " + sum);\n    }\n}`,
  javascript:`const nums = [1,2,3,4,5];\nconst sum = nums.reduce((a,b)=>a+b,0);\nconsole.log("Hello from JavaScript!");\nconsole.log("Sum:", sum);\nconsole.log("Squares:", nums.map(n=>n*n));`,
  r:`x <- 1:10\ncat("Mean:", mean(x), "\\n")\ncat("Sum:", sum(x), "\\n")`,
  octave:`x = 1:5;\nprintf("Sum = %d\\n", sum(x));\nprintf("Product = %d\\n", prod(x));`
};

window.onload = () => onLangChange();

function onLangChange() {
  const lang = document.getElementById('lang').value;
  const ta = document.getElementById('code');
  const vals = Object.values(TEMPLATES);
  if (!ta.value.trim() || vals.includes(ta.value)) ta.value = TEMPLATES[lang] || '';
  setIdle();
}

function setIdle() {
  document.getElementById('output').innerHTML = '<div class="idle-msg">Press <strong>Run</strong> to execute your code.</div>';
  document.getElementById('outHeader').innerHTML = '<span class="pane-title">Output</span>';
  document.getElementById('debugRaw').style.display = 'none';
}

function setRunning(on) {
  const btn = document.getElementById('runBtn');
  btn.disabled = on;
  btn.className = on ? 'run-btn running' : 'run-btn';
  document.getElementById('btnIcon').textContent = on ? '⏳' : '▶';
  document.getElementById('btnText').textContent = on ? 'Running…' : 'Run';
}

async function runCode() {
  const code = document.getElementById('code').value;
  const lang = document.getElementById('lang').value;
  const stdin = document.getElementById('stdin').value;
  const langId = LANG_IDS[lang];
  if (!code.trim()) return;
  setRunning(true);
  document.getElementById('output').innerHTML = '<div class="loading-msg"><div class="spinner"></div> Submitting to Judge0…</div>';
  document.getElementById('outHeader').innerHTML = '<span class="pane-title">Output</span>';
  try {
    const submitResp = await fetch(`${JUDGE0_URL}/submissions?base64_encoded=true`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ source_code: btoa(unescape(encodeURIComponent(code))), language_id: langId, stdin: btoa(stdin) })
    });
    if (!submitResp.ok) { showError(`Submit failed HTTP ${submitResp.status}`); setRunning(false); return; }
    const { token } = await submitResp.json();
    if (!token) { showError('No token returned from Judge0'); setRunning(false); return; }
    document.getElementById('output').innerHTML = `<div class="loading-msg"><div class="spinner"></div> Executing… (token: ${token.slice(0,8)}…)</div>`;
    let result = null;
    for (let i = 0; i < 60; i++) {
      await sleep(500);
      const pr = await fetch(`${JUDGE0_URL}/submissions/${token}?base64_encoded=true&fields=status,stdout,stderr,compile_output,time,memory`);
      if (!pr.ok) continue;
      const pd = await pr.json();
      const sid = (pd.status||{}).id;
      if (sid && sid !== 1 && sid !== 2) { result = pd; break; }
    }
    if (!result) { showError('Timed out (30s)'); setRunning(false); return; }
    const dbg = document.getElementById('debugRaw');
    dbg.style.display = 'block';
    dbg.textContent = 'Judge0 raw → ' + JSON.stringify(result, null, 2).slice(0,600);
    renderResult(result, lang, langId);
  } catch(err) { showError(`Network error: ${err.message}\n\nIs Judge0 running on port 2358?`); }
  setRunning(false);
}

function renderResult(d, lang, langId) {
  const b64d = s => { try { return s ? decodeURIComponent(escape(atob(s))) : ''; } catch(e) { return s||''; } };
  const sid   = (d.status||{}).id||0;
  const desc  = (d.status||{}).description||'Unknown';
  const ok    = sid === 3;
  const stdout = b64d(d.stdout), stderr = b64d(d.stderr), cerr = b64d(d.compile_output);
  let hdr = `<span class="pane-title">Output</span>
    <span class="stat-pill ${ok?'ok':'err'}">${esc(desc)}</span>`;
  if (d.time)   hdr += `<span class="stat-pill ok">⏱ ${parseFloat(d.time).toFixed(3)}s</span>`;
  if (d.memory) hdr += `<span class="stat-pill">🧠 ${(d.memory/1024).toFixed(1)} MB</span>`;
  hdr += `<span class="stat-pill">${lang.toUpperCase()}</span>`;
  document.getElementById('outHeader').innerHTML = hdr;
  let html = '';
  if (cerr) html += `<div class="out-block"><div class="out-section">Compilation Error</div><div class="out-err">${esc(cerr)}</div></div>`;
  if (stdout) { const clean = stdout.split('\n').map(l=>l.split('\r').pop()).join('\n').trimEnd(); html += `<div class="out-block">${cerr?'<div class="out-section" style="margin-top:8px">Output</div>':''}<div class="out-ok">${esc(clean)}</div></div>`; }
  if (stderr) html += `<div class="out-block"><div class="out-section">Stderr</div><div class="out-warn">${esc(stderr)}</div></div>`;
  if (!stdout&&!stderr&&!cerr) html += ok ? `<div class="out-block" style="color:var(--text-3)">✓ Ran successfully with no output.</div>` : `<div class="out-block out-err">❌ ${esc(desc)}</div>`;
  document.getElementById('output').innerHTML = html;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
function showError(msg) { document.getElementById('output').innerHTML = `<div class="out-block out-err">❌ ${esc(msg)}</div>`; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('code').addEventListener('keydown', e => {
  if (e.key==='Tab') { e.preventDefault(); const ta=e.target,s=ta.selectionStart; ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s+4; }
  if (e.key==='Enter'&&(e.ctrlKey||e.metaKey)) { e.preventDefault(); runCode(); }
});
</script>
</body>
</html>
